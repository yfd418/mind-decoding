<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="leafGradient" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#4A6658"/>
      <stop offset="100%" stop-color="#6B8E7B"/>
    </linearGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4B675"/>
      <stop offset="100%" stop-color="#C9A050"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer glow circles -->
  <circle cx="100" cy="100" r="85" fill="none" stroke="#6B8E7B" stroke-width="0.5" opacity="0.15"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="#6B8E7B" stroke-width="0.5" opacity="0.1"/>
  <circle cx="100" cy="100" r="91" fill="none" stroke="#6B8E7B" stroke-width="0.5" opacity="0.05"/>
  
  <!-- Main circle background -->
  <circle cx="100" cy="100" r="82" fill="#FDFBF7" stroke="#1B2B22" stroke-width="3"/>
  
  <!-- Left leaf -->
  <path d="M97 55 Q70 70 65 95 Q60 120 75 140 Q90 130 97 110 Q97 80 97 55" 
        fill="url(#leafGradient)" opacity="0.85"/>
  
  <!-- Right leaf -->
  <path d="M103 55 Q130 70 135 95 Q140 120 125 140 Q110 130 103 110 Q103 80 103 55" 
        fill="url(#leafGradient)" opacity="0.85"/>
  
  <!-- Center stem/light ray -->
  <path d="M100 50 Q102 80 100 100 Q98 120 100 145" 
        fill="none" stroke="#1B2B22" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Golden seed/keyhole at center -->
  <circle cx="100" cy="95" r="12" fill="url(#goldGradient)" filter="url(#glow)"/>
  <circle cx="100" cy="95" r="5" fill="#FDFBF7"/>
  
  <!-- Decorative dots (dewdrops) -->
  <circle cx="60" cy="75" r="2" fill="#C9A050" opacity="0.7"/>
  <circle cx="140" cy="75" r="2" fill="#C9A050" opacity="0.7"/>
  <circle cx="55" cy="130" r="1.5" fill="#C9A050" opacity="0.5"/>
  <circle cx="145" cy="130" r="1.5" fill="#C9A050" opacity="0.5"/>
  <circle cx="100" cy="155" r="2" fill="#C9A050" opacity="0.6"/>
  
  <!-- Small leaf accent at top -->
  <path d="M100 38 Q95 42 100 48 Q105 42 100 38" fill="#6B8E7B" opacity="0.8"/>
</svg>
